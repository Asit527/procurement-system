# Application identity and port
spring.application.name=order-service
server.port=8082

# Order database
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
# Read the password from an environment variable
spring.datasource.password=${DB_PASSWORD}

# Local development database settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Supplier HTTP connection and response timeouts in milliseconds
spring.cloud.openfeign.client.config.supplier-service.connectTimeout=3000
spring.cloud.openfeign.client.config.supplier-service.readTimeout=5000

# OrderService explicitly wraps the supplier call in a circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=false

# Evaluate the latest 5 counted calls
resilience4j.circuitbreaker.instances.supplierLookup.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.supplierLookup.slidingWindowSize=5
resilience4j.circuitbreaker.instances.supplierLookup.minimumNumberOfCalls=5

# Open the circuit when at least 50 percent of calls fail
resilience4j.circuitbreaker.instances.supplierLookup.failureRateThreshold=50

# Wait 10 seconds before allowing recovery trial calls
resilience4j.circuitbreaker.instances.supplierLookup.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.supplierLookup.permittedNumberOfCallsInHalfOpenState=2

# Exclude missing suppliers from circuit-breaker failure counts
resilience4j.circuitbreaker.instances.supplierLookup.ignoreExceptions[0]=feign.FeignException$NotFound

# Log circuit-breaker state changes during local testing
# Reduce circuit-breaker log output
logging.level.io.github.resilience4j.circuitbreaker=INFO

# Expose health monitoring
management.endpoints.web.exposure.include=health,info