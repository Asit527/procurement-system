# Application identity
spring.application.name=order-service

# Load central configuration
spring.config.import=configserver:http://localhost:8888

# Order database
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Local development database settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# OrderService explicitly wraps the supplier call
spring.cloud.openfeign.circuitbreaker.enabled=false

# Evaluate the latest 5 counted calls
resilience4j.circuitbreaker.instances.supplierLookup.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.supplierLookup.slidingWindowSize=5
resilience4j.circuitbreaker.instances.supplierLookup.minimumNumberOfCalls=5

# Open when at least 50 percent of calls fail
resilience4j.circuitbreaker.instances.supplierLookup.failureRateThreshold=50

# Allow recovery trials after 10 seconds
resilience4j.circuitbreaker.instances.supplierLookup.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.supplierLookup.permittedNumberOfCallsInHalfOpenState=2

# Missing suppliers do not count as service failures
resilience4j.circuitbreaker.instances.supplierLookup.ignoreExceptions[0]=feign.FeignException$NotFound

# Normal logging
logging.level.io.github.resilience4j.circuitbreaker=INFO

# Health monitoring
management.endpoints.web.exposure.include=health,info

# Validate tokens issued by auth-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8083/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences[0]=procurement-api
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256