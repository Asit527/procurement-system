# Gateway name and port
spring.application.name=api-gateway
server.port=8080

# Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Forward supplier requests to supplier-service
spring.cloud.gateway.server.webmvc.routes[0].id=supplier-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://supplier-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/suppliers/**

# Forward order requests to order-service
spring.cloud.gateway.server.webmvc.routes[1].id=order-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

# Gateway health endpoint
management.endpoints.web.exposure.include=health,info

# Route login requests to auth-service
spring.cloud.gateway.server.webmvc.routes[2].id=auth-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/auth/**

# Verify JWT issuer, signature, and intended audience
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8083/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences[0]=procurement-api
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256