# Gateway name and port
spring.application.name=api-gateway
server.port=8080

# Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Forward supplier requests to supplier-service
spring.cloud.gateway.server.webmvc.routes[0].id=supplier-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://supplier-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/suppliers/**

# Forward order requests to order-service
spring.cloud.gateway.server.webmvc.routes[1].id=order-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

# Gateway health endpoint
management.endpoints.web.exposure.include=health,info