# Service identity
spring.application.name=auth-service
server.port=8083

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Local test account; password comes from Eclipse environment
app.auth.username=asit
app.auth.password=${AUTH_PASSWORD}

# JWT issuer
app.auth.issuer=http://localhost:8083

# Health monitoring
management.endpoints.web.exposure.include=health,info
# Read-only user's password from Eclipse environment
app.auth.viewer-password=${VIEWER_PASSWORD}